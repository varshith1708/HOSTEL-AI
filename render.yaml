services:
  - type: web
    name: ai-it-helpdesk-analyzer
    env: python
    buildCommand: pip install -r requirements.txt && python -m scripts.seed
    startCommand: gunicorn run:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
